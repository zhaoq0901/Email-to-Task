<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gmail to Google Calendar Task Options</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; color: #202124; }
    label { display: block; margin-bottom: 8px; font-weight: 600; }
    input { width: 100%; padding: 10px 12px; font-size: 14px; margin-bottom: 12px; border: 1px solid #dadce0; border-radius: 8px; }
    button { background: #1a73e8; color: white; border: none; padding: 10px 16px; border-radius: 8px; cursor: pointer; font-size: 14px; }
    .hint { margin-top: 8px; color: #5f6368; font-size: 13px; }
    .status { margin-top: 12px; font-size: 14px; }
  </style>
</head>
<body>
  <h1>Gmail → Google Calendar Task</h1>
  <p>Enter your OpenAI API key to enable AI email summarization and calendar task creation.</p>
  <label for="api-key">OpenAI API Key</label>
  <input id="api-key" type="password" placeholder="sk-..." autocomplete="off" />
  <button id="save-btn">Save API Key</button>
  <div class="hint">Your key is stored locally in the extension and used only to call the OpenAI API.</div>
  <div class="status" id="status"></div>
  <script src="options.js"></script>
</body>
</html>
